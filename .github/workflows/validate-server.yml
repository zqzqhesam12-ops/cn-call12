name: Validate Server Python Syntax

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/validate-server.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-syntax:
    name: Compile server Python modules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python files without executing the service
        run: python -m py_compile server/*.py
