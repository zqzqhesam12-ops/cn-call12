build:
  system: docker
  min_cpu: 0.1
  max_cpu: 0.5
  min_memory: 256
  max_memory: 512

dockerfile_path: server/Dockerfile
working_directory: /
build_context_directory: /

scaling:
  trigger: http_requests
  min_cpu: 0.1
  max_cpu: 0.25
  min_memory: 128
  max_memory: 512
  min_replicas: 1
  max_replicas: 1

health_check:
  type: tcp
  interval_in_seconds: 10
